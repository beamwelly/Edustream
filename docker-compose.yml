# Masterclass — Docker Compose
#
# HOW TO SET ENV VARS:
#   1. Copy .env.example to .env  →  cp .env.example .env
#   2. Fill in all values in .env
#   3. Run: docker compose up --build
#
# All secrets are injected at RUNTIME from the host .env file.
# No .env files are copied into or baked into any Docker image.

services:

  # ── Backend (FastAPI / Uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      - DATABASE_URL=${DATABASE_URL}
      # ── Auth / JWT ────────────────────────────────────────────────────────
      - SECRET_KEY=${SECRET_KEY:-changeme-set-a-real-secret-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # ── CORS ──────────────────────────────────────────────────────────────
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # ── Supabase ──────────────────────────────────────────────────────────
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-edustream-content-library}
      # ── Google OAuth ──────────────────────────────────────────────────────
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      # ── Zoom ──────────────────────────────────────────────────────────────
      - ZOOM_ACCOUNT_ID=${ZOOM_ACCOUNT_ID}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET}
      - ZOOM_WEBHOOK_SECRET=${ZOOM_WEBHOOK_SECRET}
      # ── SMTP Email ────────────────────────────────────────────────────────
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # ── Redis ─────────────────────────────────────────────────────────────
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      # ── Runtime ───────────────────────────────────────────────────────────
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # ── Frontend (React/Vite → Nginx on port 80) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL is used ONLY during 'npm run build' (compile time).
        # It is NOT stored as an env var in the final nginx image.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
